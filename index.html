<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2360a5fa'/><stop offset='100%25' stop-color='%23a78bfa'/></linearGradient></defs><line x1='35' y1='10' x2='35' y2='90' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/><line x1='65' y1='10' x2='65' y2='90' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/><line x1='10' y1='35' x2='90' y2='35' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/><line x1='10' y1='65' x2='90' y2='65' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/><line x1='16' y1='16' x2='28' y2='28' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/><line x1='28' y1='16' x2='16' y2='28' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/><circle cx='50' cy='50' r='8' fill='none' stroke='url(%23g)' stroke-width='5'/><line x1='72' y1='72' x2='84' y2='84' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/><line x1='84' y1='72' x2='72' y2='84' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<div id="startScreen" class="card">

<h1 class="title">Tic Tac Toe</h1>

<div class="rules" id="rulesBox">

<h3>How to Play</h3>

<ul>
<li>Game is played on a 3×3 grid</li>
<li>Player X always goes first</li>
<li>Get 3 marks in a row to win</li>
<li>If all cells fill → Draw</li>
</ul>

</div>

<div class="buttons" id="modeButtons">
<button onclick="selectMode('single')">Single Player</button>
<button onclick="selectMode('multi')">Two Players</button>
</div>

<div class="buttons hidden" id="difficultyButtons">
<button onclick="startGameWithDifficulty('easy')">Easy</button>
<button onclick="startGameWithDifficulty('medium')">Medium</button>
<button onclick="startGameWithDifficulty('hard')">Hard</button>
</div>

</div>

<div id="gameScreen" class="hidden">

<div class="topBar">
<h2 id="turnText">Player 1 Turn</h2>
<button class="restart" onclick="restartGame()">Restart</button>
</div>

<div class="board">

<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>

<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>

<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>

<div id="winLine"></div>

</div>

<div class="leaderboard">

<h3>Leaderboard</h3>

<div class="score header">
<span>User</span>
<span>Win</span>
<span>Loss</span>
<span>Draw</span>
</div>

<div class="score">
<span id="player1Label">Player</span>
<span id="p1Wins">0</span>
<span id="p1Loss">0</span>
<span id="p1Draw">0</span>
</div>

<div class="score">
<span id="player2Label">Computer</span>
<span id="p2Wins">0</span>
<span id="p2Loss">0</span>
<span id="p2Draw">0</span>
</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
